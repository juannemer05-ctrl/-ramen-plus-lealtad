<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recuperar contraseña | RAMEN+</title>
<style>
body{font-family:Arial,sans-serif;background:#fff8dc;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:white;border-radius:22px;padding:28px;width:85%;max-width:380px;text-align:center}
h1{font-size:38px;margin:0}h1 span{color:#f4c542}
input,button{box-sizing:border-box;width:100%;padding:15px;margin-top:15px;border-radius:12px;font-size:16px}
input{border:1px solid #ccc}button{background:#111;color:white;border:0;font-weight:bold}
#mensaje{line-height:1.5}
</style>
</head>
<body>
<div class="card">
<h1>RAMEN<span>+</span></h1>
<h2>Nueva contraseña</h2>
<p>Escribe tu nueva contraseña para el acceso de empleados.</p>
<input id="password" type="password" placeholder="Nueva contraseña" autocomplete="new-password">
<button id="guardar" disabled>Verificando enlace...</button>
<p id="mensaje"></p>
</div>
<script>
const SUPABASE_URL="https://hkprarjyormsogskdddz.supabase.co";
const params=new URLSearchParams(location.hash.substring(1));
const token=params.get("access_token");
const refresh=params.get("refresh_token");
const type=params.get("type");
const mensaje=document.getElementById("mensaje");
const boton=document.getElementById("guardar");
let accessToken=null;
async function iniciar(){
 try{
  if(type==="recovery" && token){
   accessToken=token;
  }else if(refresh){
   const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({refresh_token:refresh})
   });
   const data=await r.json();
   if(!r.ok)throw Error(data.msg||data.error_description||"Enlace inválido");
   accessToken=data.access_token;
  }
  if(!accessToken)throw Error("Abre esta página desde el correo de recuperación.");
  boton.disabled=false;
  boton.textContent="Guardar nueva contraseña";
  history.replaceState(null,"",location.pathname);
 }catch(e){mensaje.textContent=e.message;boton.textContent="Enlace no válido";}
}
boton.onclick=async()=>{
 const password=document.getElementById("password").value;
 if(password.length<12){mensaje.textContent="Utiliza al menos 12 caracteres.";return;}
 boton.disabled=true;
 mensaje.textContent="Guardando...";
 try{
  const r=await fetch(SUPABASE_URL+"/auth/v1/user",{
   method:"PUT",headers:{"Content-Type":"application/json","Authorization":"Bearer "+accessToken},
   body:JSON.stringify({password})
  });
  const data=await r.json();
  if(!r.ok)throw Error(data.msg||data.error_description||data.message||"No se pudo cambiar la contraseña.");
  mensaje.textContent="Contraseña actualizada. Ya puedes regresar a RAMEN+.";
  boton.textContent="Contraseña guardada";
  document.getElementById("password").value="";
 }catch(e){mensaje.textContent=e.message;boton.disabled=false;}
};
iniciar();
</script>
</body>
</html>
