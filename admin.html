<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAMEN+ | Registrar compra</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #fff7d6;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 430px;
  background: white;
  border-radius: 28px;
  padding: 30px 22px;
  text-align: center;
  box-shadow: 0 12px 35px rgba(0,0,0,.15);
}

.logo {
  font-size: 42px;
  font-weight: 900;
}

.plus { color: #ffc400; }

h2 { margin-top: 5px; }

input {
  width: 100%;
  padding: 16px;
  margin: 10px 0;
  border: 2px solid #ddd;
  border-radius: 14px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 17px;
  margin-top: 12px;
  border: 0;
  border-radius: 16px;
  background: #111;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
}

#resultado {
  margin-top: 20px;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    RAMEN<span class="plus">+</span>
  </div>

  <h2>Registrar compra</h2>
<button type="button" onclick="iniciarSesion()">
  🔐 Iniciar sesión
</button>
  <p>Introduce el ID de la tarjeta del cliente.</p>

  <input
    id="customerId"
    placeholder="ID del cliente"
    autocomplete="off"
  >

  <button id="btn" onclick="registrarCompra()">
    ✓ Agregar compra
  </button>

  <div id="resultado"></div>

</div>

<script>

const SUPABASE_URL =
"https://hkprarjyormsogskdddz.supabase.co";

/*
PEGA AQUÍ LA MISMA SUPABASE_KEY
QUE YA TIENES EN index.html
*/
const SUPABASE_KEY = "sb_publishable_YAKtkxRA1sH3zdE3R_4iSg_KScO8EtI";
async function iniciarSesion() {
  const email = prompt("Correo del administrador:");
  if (!email) return;

  const password = prompt("Contraseña:");
  if (!password) return;

  const response = await fetch(
    `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email, password })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    alert("No se pudo iniciar sesión. Revisa tus datos.");
    return;
  }

  sessionStorage.setItem("ramen_staff_token", data.access_token);
  alert("Sesión iniciada correctamente.");
}
async function registrarCompra() {
const token = sessionStorage.getItem("ramen_staff_token");

if (!token) {
  alert("Debes iniciar sesión para registrar compras.");
  return;
}
  const customerId =
    document.getElementById("customerId").value.trim();

  const resultado =
    document.getElementById("resultado");

  const btn =
    document.getElementById("btn");

  if (!customerId) {
    resultado.textContent =
      "Escribe el ID del cliente.";
    return;
  }

  btn.disabled = true;
  resultado.textContent = "Registrando...";

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/rpc/add_purchase`,
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          p_customer_id: customerId
        })
      }
    );

    if (!response.ok) {
    const detalle = await response.text();
throw new Error(detalle);
    }

    const total = await response.json();

    resultado.textContent =
      `✅ Compra registrada. Total: ${total}`;

  } catch (error) {

    resultado.textContent =
      "❌ Error: " + error.message;

  } finally {

    btn.disabled = false;

  }
}

</script>
  <section class="card" style="margin-top:20px">
  <h2>Registrar nuevo cliente</h2>
<script>
async function registrarCliente() {

</script>
  <input id="nuevoNombre"
    placeholder="Nombre del cliente">

  <input id="nuevoCelular"
    type="tel"
    placeholder="Celular (opcional)">

  <label>
    <input id="aceptaPromos" type="checkbox">
    Acepto recibir promociones por WhatsApp
  </label>

  <button onclick="registrarCliente()">
    Registrar cliente
  </button>

  <p id="resultadoRegistro"></p>
</section>

</body>
</html>
