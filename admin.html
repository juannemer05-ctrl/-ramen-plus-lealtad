<script>

const SUPABASE_URL =
"https://hkprarjyormsogskdddz.supabase.co";

/*
PEGA AQUÍ LA MISMA SUPABASE_KEY
QUE YA TIENES EN index.html
*/
const SUPABASE_KEY = "sb_publishable_YAKtkxRA1sH3zdE3R_4iSg_KScO8EtI";
async function iniciarSesion() {
  const email = prompt("Correo del administrador:");
  if (!email) return;

  const password = prompt("Contraseña:");
  if (!password) return;

  const response = await fetch(
    `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email, password })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    alert("No se pudo iniciar sesión. Revisa tus datos.");
    return;
  }

  sessionStorage.setItem("ramen_staff_token", data.access_token);
  alert("Sesión iniciada correctamente.");
}
async function registrarCompra() {
const token = sessionStorage.getItem("ramen_staff_token");

if (!token) {
  alert("Debes iniciar sesión para registrar compras.");
  return;
}
  const customerId =
    document.getElementById("customerId").value.trim();

  const resultado =
    document.getElementById("resultado");

  const btn =
    document.getElementById("btn");

  if (!customerId) {
    resultado.textContent =
      "Escribe el ID del cliente.";
    return;
  }

  btn.disabled = true;
  resultado.textContent = "Registrando...";

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/rpc/add_purchase`,
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          p_customer_id: customerId
        })
      }
    );

    if (!response.ok) {
    const detalle = await response.text();
throw new Error(detalle);
    }

    const total = await response.json();

    resultado.textContent =
      `✅ Compra registrada. Total: ${total}`;
document.getElementById("btnCanjear").style.display =
  Number(total) >= 6 ? "block" : "none";
  } catch (error) {

    resultado.textContent =
      "❌ Error: " + error.message;

  } finally {

    btn.disabled = false;

  }
}

</script>

  📷 Escanear QR del cliente

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>

async function escanearQR() {
 
  

  const archivo = document.createElement("input");
  archivo.type = "file";
  archivo.accept = ".jpg,.jpeg,.png";
  

  archivo.onchange = async () => {
    try {
      const foto = archivo.files[0];
      if (!foto) return;

      const imagen = await createImageBitmap(foto);
    

      const canvas = document.createElement("canvas");
canvas.width = imagen.width;
canvas.height = imagen.height;

const ctx = canvas.getContext("2d");
ctx.drawImage(imagen, 0, 0);

const datos = ctx.getImageData(0, 0, canvas.width, canvas.height);
const qr = jsQR(datos.data, datos.width, datos.height, {
  inversionAttempts: "attemptBoth"
});

const codigos = qr ? [{ rawValue: qr.data }] : [];
      imagen.close();

      if (!codigos.length) {
        alert("No se encontró un código QR.");
        return;
      }

      const enlace = new URL(codigos[0].rawValue);
      const id = enlace.searchParams.get("id");

      if (!id) {
        alert("El QR no contiene un ID válido.");
        return;
      }

      document.getElementById("customerId").value = id;
      alert("✅ Tarjeta identificada. Ya puedes agregar la compra.");

    } catch (error) {
      alert("No se pudo leer el QR: " + error.message);
    }
  };

  archivo.click();
  }
 
async function canjearPremio() {
  const id = document.getElementById("customerId").value.trim();
  const resultado = document.getElementById("resultado");
  const token = sessionStorage.getItem("ramen_staff_token");

  if (!token) {
    alert("Debes iniciar sesión.");
    return;
  }

  if (!id) {
    alert("Primero escanea o escribe el ID del cliente.");
    return;
  }

  if (!confirm("¿Confirmas que entregaste la bebida gratis?")) {
    return;
  }

  try {
    const respuesta = await fetch(
      SUPABASE_URL + "/rest/v1/rpc/redeem_reward",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ p_customer_id: id })
      }
    );

    const datos = await respuesta.json();

    if (!respuesta.ok) {
      throw new Error(datos.message || "No se pudo canjear.");
    }

    resultado.textContent = "🎁 Bebida gratis canjeada correctamente.";
  } catch (error) {
    resultado.textContent = "❌ " + error.message;
  }
}
 
</script>
