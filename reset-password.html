
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restablecer contraseña | RAMEN+</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff8d6;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 22px;
      padding: 28px;
      max-width: 400px;
      width: 100%;
      margin-top: 60px;
      text-align: center;
      box-shadow: 0 8px 25px #0001;
    }
    h1 { font-size: 42px; margin-bottom: 8px; }
    h1 span { color: #f5bf00; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border-radius: 12px;
      font-size: 17px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #111;
      color: white;
      border: none;
      font-weight: bold;
    }
    #mensaje { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>RAMEN<span>+</span></h1>
    <h2>Nueva contraseña</h2>
    <p>Ingresa tu nueva contraseña de empleado.</p>

    <input id="password" type="password"
      placeholder="Nueva contraseña" minlength="8">

    <input id="confirmar" type="password"
      placeholder="Confirmar contraseña" minlength="8">

    <button id="guardar" onclick="cambiarPassword()">
      Guardar contraseña
    </button>

    <p id="mensaje">Verificando enlace...</p>
  </div>

  <script>
    const SUPABASE_URL =
      "https://hkprarjyormsogskdddz.supabase.co";

    const mensaje = document.getElementById("mensaje");
    const guardar = document.getElementById("guardar");
    let token = "";

    async function verificarEnlace() {
      const hash = new URLSearchParams(
        window.location.hash.substring(1)
      );

      token = hash.get("access_token") || "";

      if (!token) {
        const code = new URLSearchParams(
          window.location.search
        ).get("code");

        if (code) {
          mensaje.textContent =
            "Este enlace necesita una configuración adicional. Solicita uno nuevo.";
          guardar.disabled = true;
          return;
        }

        mensaje.textContent =
          "Enlace inválido o vencido. Solicita uno nuevo.";
        guardar.disabled = true;
        return;
      }

      history.replaceState(
        null, "",
        window.location.pathname
      );

      mensaje.textContent =
        "Enlace recibido. Puedes crear tu contraseña.";
    }

    async function cambiarPassword() {
      const password =
        document.getElementById("password").value;
      const confirmar =
        document.getElementById("confirmar").value;

      if (!token) {
        mensaje.textContent = "Enlace no válido.";
        return;
      }

      if (password.length < 8) {
        mensaje.textContent =
          "La contraseña debe tener al menos 8 caracteres.";
        return;
      }

      if (password !== confirmar) {
        mensaje.textContent =
          "Las contraseñas no coinciden.";
        return;
      }

      guardar.disabled = true;
      mensaje.textContent = "Guardando...";

      try {
        const respuesta = await fetch(
          SUPABASE_URL + "/auth/v1/user",
          {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "apikey": "sb_publishable_YAKtkxRA1sH3zdE3R_4iSg_KScO8EtI",
              "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ password })
          }
        );

        if (!respuesta.ok) {
          throw new Error("No se pudo cambiar la contraseña.");
        }

        token = "";
        mensaje.textContent =
          "Contraseña actualizada correctamente. Ya puedes iniciar sesión en RAMEN+.";
        document.getElementById("password").value = "";
        document.getElementById("confirmar").value = "";
      } catch (error) {
        mensaje.textContent = error.message;
        guardar.disabled = false;
      }
    }

    verificarEnlace();
  </script>
</body>
</html>
