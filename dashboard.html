
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel administrativo RAMEN+</title>
<style>
body{margin:0;background:#fff8da;font-family:Arial,sans-serif;color:#111}
main{max-width:850px;margin:25px auto;padding:18px}
h1{text-align:center;font-size:40px;margin-bottom:4px}
h1 span{color:#efc33d}
h2{text-align:center}
section{background:white;border-radius:22px;padding:22px;margin:18px 0}
input,button{box-sizing:border-box;width:100%;padding:16px;margin:7px 0;border-radius:12px;font-size:16px}
input{border:1px solid #ccc}
button{background:#111;color:white;border:0;font-weight:bold;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fff8da;border-radius:15px;padding:18px;text-align:center}
.numero{font-size:34px;font-weight:bold}
small{color:#555}
#panel{display:none}
#error{color:#b00020}
 
#tablaClientes {
  overflow-x: visible !important;
}

#tablaClientes table {
  display: block;
  width: 100% !important;
}

#tablaClientes table tr:first-child {
  display: none;
}

#tablaClientes table tr:not(:first-child) {
  display: block;
  background: #fff;
  border: 1px solid #e5e5e5;
  border-radius: 16px;
  padding: 14px;
  margin: 14px 0;
  box-shadow: 0 3px 10px #0000000d;
}

#tablaClientes table td {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 0 !important;
  border-top: 1px solid #eee;
  text-align: right;
  overflow-wrap: anywhere;
}

#tablaClientes table td::before {
  font-weight: bold;
  text-align: left;
  color: #555;
}

#tablaClientes table td:nth-child(1)::before {
  content: "Cliente";
}
#tablaClientes table td:nth-child(2)::before {
  content: "Compras";
}
#tablaClientes table td:nth-child(3)::before {
  content: "Estado";
}
#tablaClientes table td:nth-child(4)::before {
  content: "Bebidas canjeadas";
}
#tablaClientes table td:nth-child(5)::before {
  content: "Registro";
}
#tablaClientes table td:nth-child(6)::before {
  content: "Última compra";
}
#tablaClientes table td:nth-child(7)::before {
  content: "Teléfono";
}
#tablaClientes table td:nth-child(8)::before {
  content: "WhatsApp";
}
 
</style>
</head>
<body>
<main>
<h1>RAMEN<span>+</span></h1>
<h2>Panel administrativo</h2>

<section id="acceso">
<h3>Acceso autorizado</h3>
<input id="correo" type="email" placeholder="Correo del empleado">
<input id="clave" type="password" placeholder="Contraseña">
<button onclick="entrar()">Iniciar sesión</button>
<p id="error"></p>
</section>

<div id="panel">
<section>
<h3>Resumen del programa de lealtad</h3>
<div class="grid">
<div class="card"><div id="clientes" class="numero">—</div><small>Clientes registrados</small></div>
<div class="card"><div id="compras" class="numero">—</div><small>Compras registradas</small></div>
<div class="card"><div id="premios" class="numero">—</div><small>Bebidas gratis canjeadas</small></div>
<div class="card"><div id="pendientes" class="numero">—</div><small>Premios pendientes</small></div>
</div>
<button onclick="actualizar()">Actualizar reporte</button>
<button onclick="salir()">Cerrar sesión</button>
<p id="estado"></p>
</section>
<section>
  <h3>Detalle de clientes</h3>
  <button onclick="exportarExcel()">📊 Exportar clientes a Excel</button>
<input id="buscarCliente" type="search" placeholder="🔍 Buscar cliente por nombre o teléfono" oninput="filtrarClientes()">
  
  <button onclick="cargarClientes()">Consultar clientes</button>
  <div id="tablaClientes" style="overflow-x:auto;"></div>
</section> 
  <section>
  <h3>📋 Historial de compras y canjes</h3>
  <button onclick="consultarHistorial()">
    Consultar historial
  </button>
  <div id="historialMovimientos"></div>
</section>
</div>
</main>

<script>
const SUPABASE_URL = "https://hkprarjyormsogskdddz.supabase.co";
const SUPABASE_KEY = "sb_publishable_YAKtkxRA1sH3zdE3R_4iSg_KScO8EtI";

let token = "";

async function entrar(){
 const correo=document.getElementById("correo").value.trim();
 const password=document.getElementById("clave").value;
 document.getElementById("error").textContent="";
 try{
  const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
   method:"POST",
   headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},
   body:JSON.stringify({email:correo,password})
  });
  const d=await r.json();
  if(!r.ok || !d.access_token)throw Error("Correo o contraseña incorrectos.");
  token=d.access_token;
  sessionStorage.setItem("ramen_dashboard_token",token);
  document.getElementById("acceso").style.display="none";
  document.getElementById("panel").style.display="block";
  await actualizar();
 }catch(e){
  document.getElementById("error").textContent=e.message;
 }
}

async function contar(tabla,filtro=""){
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+tabla+"?select=id"+filtro,{
  headers:{
   "apikey":SUPABASE_KEY,
   "Authorization":"Bearer "+token,
   "Prefer":"count=exact",
   "Range":"0-0"
  }
 });
 if(!r.ok)throw Error("No se pudo consultar "+tabla+". Revisa los permisos del reporte.");
 const rango=r.headers.get("content-range");
 if(!rango || !rango.includes("/"))throw Error("No se recibió el conteo.");
 return rango.split("/")[1];
}

async function actualizar(){
 const estado=document.getElementById("estado");
 estado.textContent="Cargando datos...";
 try{
  const r = await fetch(
  SUPABASE_URL + "/rest/v1/rpc/resumen_lealtad",
  {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + token,
      "Content-Type": "application/json"
    },
    body: "{}"
  }
);

const datos = await r.json();
if (!r.ok) throw new Error(datos.message || "Error al consultar reporte");

const resumen = datos[0];
if (!resumen) throw new Error("No se recibieron datos");

const clientes = resumen.total_clientes;
const compras = resumen.total_compras;
const premios = resumen.bebidas_gratis_entregadas;
const pendientes = resumen.premios_pendientes;
  document.getElementById("clientes").textContent=clientes;
  document.getElementById("compras").textContent=compras;
  document.getElementById("premios").textContent=premios;
  document.getElementById("pendientes").textContent=pendientes;
  estado.textContent="Reporte actualizado.";
 }catch(e){estado.textContent=e.message}
}

function salir(){
 token="";
 sessionStorage.removeItem("ramen_dashboard_token");
 document.getElementById("panel").style.display="none";
 document.getElementById("acceso").style.display="block";
}
async function cargarClientes() {
  const contenedor = document.getElementById("tablaClientes");
  contenedor.textContent = "Cargando clientes...";

  try {
    const r = await fetch(
      SUPABASE_URL + "/rest/v1/rpc/detalle_clientes_admin_v4",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: "{}"
      }
    );

    const datos = await r.json();
    if (!r.ok) throw new Error(datos.message || "Error al consultar clientes");

    const tabla = document.createElement("div");
    tabla.style.cssText = "display:grid;gap:14px;width:100%;";

    

    datos.forEach(cliente => {
     const tarjeta = document.createElement("div");
tarjeta.classList.add("tarjeta-cliente");
tarjeta.style.cssText = "background:white;border:1px solid #ddd;border-radius:14px;padding:16px;box-shadow:0 2px 6px #0001;";

const campos = [
  ["Cliente", cliente.cliente],
  ["Compras acumuladas", cliente.compras_acumuladas],
  ["Estado", cliente.estado],
  ["Bebidas canjeadas", cliente.bebidas_canjeadas],
  ["Fecha de registro", cliente.fecha_registro],
  ["Última compra", cliente.ultima_compra],
  ["Teléfono", cliente.telefono],
  ["Promociones WhatsApp",
    String(cliente.promociones_whatsapp).toLowerCase() === "true" ? "Sí" : "No"]
];

campos.forEach(([titulo, valor], indice) => {
  const renglon = document.createElement("div");
  renglon.style.cssText = "padding:7px 0;border-bottom:1px solid #eee;overflow-wrap:anywhere;";

  const etiqueta = document.createElement("strong");
  etiqueta.textContent = titulo + ": ";

  const dato = document.createElement("span");
  dato.textContent = valor ?? "";

  renglon.append(etiqueta, dato);

  if (indice === 0) {
    renglon.style.fontSize = "18px";
    renglon.style.fontWeight = "bold";
  }

  tarjeta.appendChild(renglon);
});
const telefono = String(cliente.telefono ?? "").replace(/\D/g, "");
const autorizado =
  String(cliente.promociones_whatsapp).toLowerCase() === "true";

if (autorizado && telefono.length === 10) {
  const botonWhatsApp = document.createElement("a");

  const mensaje = `Hola ${cliente.cliente}, te saludamos de RAMEN+ 🍜`;

  botonWhatsApp.href =
    "https://wa.me/52" + telefono +
    "?text=" + encodeURIComponent(mensaje);

  botonWhatsApp.target = "_blank";
  botonWhatsApp.rel = "noopener noreferrer";
  botonWhatsApp.textContent = "💬 Enviar WhatsApp";

  botonWhatsApp.style.cssText =
    "display:block;background:#25D366;color:white;" +
    "padding:12px;border-radius:10px;text-align:center;" +
    "font-weight:bold;text-decoration:none;margin-top:14px;";

  tarjeta.appendChild(botonWhatsApp);
}
tabla.appendChild(tarjeta);
    });

    contenedor.replaceChildren(tabla);
  } catch (e) {
    contenedor.textContent = e.message;
  }
} 
 document.getElementById("buscarCliente").addEventListener("input", function () {
  const busqueda = this.value.toLowerCase().trim();
  const tarjetas = document.querySelectorAll("#tablaClientes .tarjeta-cliente");

tarjetas.forEach(tarjeta => {
  const texto = tarjeta.textContent.toLowerCase();
  tarjeta.style.display = texto.includes(busqueda) ? "" : "none";
});
}); 
function exportarExcel() {
  const tabla = document.querySelector("#tablaClientes > div");

if (!tabla || !tabla.children.length) {
  alert("Primero presiona Consultar clientes");
  return;
}

const encabezados = [
  "Cliente", "Compras acumuladas", "Estado",
  "Bebidas canjeadas", "Fecha registro",
  "Última compra", "Teléfono",
  "Promociones WhatsApp"
];

const csv = valor =>
  '"' + String(valor ?? "").replace(/"/g, '""') + '"';

const filas = [
  encabezados.map(csv).join(","),
  ...[...tabla.children].map(tarjeta =>
    [...tarjeta.children].filter(renglon => renglon.tagName === "DIV").map(renglon =>
      csv(renglon.querySelector("span")?.textContent ?? "")
    ).join(",")
  )
];

  const contenido = "\uFEFF" + filas.join("\r\n");
  const archivo = new Blob([contenido], {
    type: "text/csv;charset=utf-8;"
  });

  const enlace = document.createElement("a");
  enlace.href = URL.createObjectURL(archivo);
  enlace.download = "Clientes_RAMEN_PLUS.csv";
  enlace.click();
  URL.revokeObjectURL(enlace.href);
}  
  
async function consultarHistorial() {
  const contenedor = document.getElementById("historialMovimientos");

  if (!contenedor) return;

  contenedor.textContent = "Cargando historial...";

  try {
    const respuesta = await fetch(
      SUPABASE_URL +
        "/rest/v1/rpc/historial_movimientos_admin",
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + token
        }
      }
    );

    if (!respuesta.ok) {
      throw new Error("Error al consultar movimientos");
    }

    const movimientos = await respuesta.json();

    
    contenedor.replaceChildren();

    if (!movimientos.length) {
      contenedor.textContent = "No hay movimientos registrados.";
      return;
    }

    movimientos.forEach(m => {
      const tarjeta = document.createElement("div");
      tarjeta.style.cssText =
        "background:white;border:1px solid #ddd;" +
        "border-radius:15px;padding:16px;" +
        "margin:12px 0;";

      const nombre = document.createElement("strong");
      nombre.textContent =
     m.cliente || "Cliente"   
console.log("Movimiento:", m);
      const detalle = document.createElement("p");
      detalle.textContent =
        m.event_type === "purchase"
          ? "🛒 Compra registrada"
          : m.event_type === "reward_redeemed"
          ? "🎁 Bebida gratis canjeada"
          : m.event_type;

      const fecha = document.createElement("small");
      fecha.textContent = m.fecha_hora || "";
        

      tarjeta.append(nombre, detalle, fecha);
      contenedor.appendChild(tarjeta);
    });

  } catch (error) {
    contenedor.textContent =
      "No se pudo cargar el historial.";
    console.error(error);
  }
}

</script>
</body>
</html>
