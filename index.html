<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAMEN+ | Tarjeta de Lealtad</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #fff7d6;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 28px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,0,0,.15);
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .plus { color: #f5c400; }

    h2 {
      margin: 5px 0;
      font-size: 25px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 25px;
    }

    #name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .stamps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 25px auto;
    }

    .stamp {
      aspect-ratio: 1;
      border: 3px dashed #f5c400;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      background: #fffdf3;
    }

    .stamp.active {
      background: #f5c400;
      border-style: solid;
    }

    .reward {
      margin-top: 20px;
      padding: 18px;
      border-radius: 18px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .free {
      background: #f5c400;
      color: #111;
    }

    .small {
      font-size: 13px;
      color: #777;
      margin-top: 18px;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="logo">RAMEN<span class="plus">+</span></div>

  <h2>Tarjeta de Lealtad</h2>

  <div class="subtitle">
    Compra 6 veces y tu 7ª bebida es GRATIS 🎁
  </div>

  <div id="name">Cargando...</div>

  <div class="stamps" id="stamps"></div>

  <div class="reward" id="reward">
    Sigue acumulando visitas 🍜
  </div>

  <div class="small">
    Presenta esta tarjeta en RAMEN+ en cada compra.
  </div>

</div>

<script>

const SUPABASE_URL =
"https://hkprarjyormsogskdddz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YAKtkxRA1sH3zdE3R_4iSg_KScO8EtI";

const params = new URLSearchParams(window.location.search);
const cardId = params.get("id");

async function cargarTarjeta() {

  const name = document.getElementById("name");

  if (!cardId) {
    name.innerHTML =
      '<span class="error">Tarjeta no encontrada</span>';
    return;
  }

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/rpc/get_loyalty_card`,
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          p_card_id: cardId
        })
      }
    );

    if (!response.ok) {
      throw new Error("No se pudo consultar la tarjeta");
    }

    const result = await response.json();

    if (!result || result.length === 0) {
      name.innerHTML =
        '<span class="error">Tarjeta no encontrada</span>';
      return;
    }

    const cliente = result[0];

    name.textContent = cliente.customer_name;

    const stampsContainer =
      document.getElementById("stamps");

    stampsContainer.innerHTML = "";

    for (let i = 1; i <= 6; i++) {

      const stamp = document.createElement("div");

      stamp.className =
        i <= cliente.stamps
        ? "stamp active"
        : "stamp";

      stamp.innerHTML =
        i <= cliente.stamps ? "✓" : i;

      stampsContainer.appendChild(stamp);
    }

    const reward =
      document.getElementById("reward");

    if (cliente.stamps >= 6) {

      reward.textContent =
        "🎉 ¡Tu próxima bebida es GRATIS!";

      reward.classList.add("free");

    } else {

      const faltan = 6 - cliente.stamps;

      reward.textContent =
        `Te faltan ${faltan} compra${faltan === 1 ? "" : "s"} para tu bebida gratis`;

    }

  } catch (error) {

    name.innerHTML =
      '<span class="error">Error al cargar la tarjeta</span>';

  }
}

cargarTarjeta();

</script>
  <script>
async function registrarCompra() {
  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/rpc/add_purchase`,
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        p_customer_id: cardId
      })
    }
  );

  if (response.ok) {
    await cargarTarjeta();
  } else {
    alert("No se pudo registrar la compra");
  }
}
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const id = new URLSearchParams(location.search).get("id");
  if (!id) return;

  const qr = document.createElement("div");
  qr.style.cssText = "background:white;padding:20px;text-align:center;border-radius:20px;margin:20px auto;max-width:300px";
  qr.innerHTML = `
    <h3>Mi código QR RAMEN+</h3>
    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(location.origin + location.pathname + "?id=" + id)}"
      alt="Código QR del cliente"
      style="width:220px;max-width:100%"
    >
    <p>Presenta este QR en cada compra</p>
  `;

  document.body.appendChild(qr);
});
</script>
</body>
</html>
